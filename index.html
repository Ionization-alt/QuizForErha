<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics Chapter 1 — Mastery Quiz</title>
<style>
:root{--bg:#eef2f6;--grid:#dde5ee;--card:#fff;--ink:#14233a;--muted:#5a6b82;--line:#c5d1df;--accent:#0b6e8a;--accentInk:#fff;--good:#17714a;--goodBg:#e1f3ea;--bad:#a63a2b;--badBg:#fbe7e3}
@media(prefers-color-scheme:dark){:root{--bg:#0f1824;--grid:#182535;--card:#16212f;--ink:#e6edf6;--muted:#9bacc2;--line:#2c3d52;--accent:#4fb6d3;--accentInk:#06202a;--good:#6fd3a3;--goodBg:#12362a;--bad:#f19a8b;--badBg:#3b1e1a}}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
main{max-width:850px;margin:auto;padding:32px 18px 64px}h1{font:700 2rem/1.15 Georgia,serif;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.badge{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{flex:1 1 170px;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}.tab b{display:block;font-family:Georgia,serif;font-size:1.02rem}.tab span{color:var(--muted);font-size:.82rem}.tab[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 -4px 0 var(--accent)}
button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}.count{color:var(--muted);font-size:.85rem;margin:0 0 14px}.q{font:600 1.25rem/1.4 Georgia,serif;margin:0 0 16px}.opts{display:grid;gap:10px}.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}.opt.right{background:var(--goodBg);border-color:var(--good);color:var(--good)}.opt.wrong{background:var(--badBg);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:16px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--grid);border-radius:0 6px 6px 0}.fb strong{display:block}.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accentInk);font-weight:600;cursor:pointer}.btn.alt{background:transparent;color:var(--accent)}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}.score{font:700 3rem/1 Georgia,serif;margin:4px 0 6px}.review{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:7px}.review li{padding:10px 12px;border-radius:6px;font-size:.92rem}.review .ok{background:var(--goodBg)}.review .no{background:var(--badBg)}.small{font-size:.88rem;color:var(--muted)}.checkrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.checkrow input{margin-top:6px}.footer{color:var(--muted);font-size:.82rem;margin-top:14px}
@media(max-width:560px){main{padding:22px 12px 48px}.card{padding:17px}.q{font-size:1.12rem}}
</style>
</head>
<body><main>
<div class="top"><div><h1>Statistics: Chapter 1 Mastery</h1><p class="sub">A tricky, mixed-format review. Read every question carefully.</p></div><span class="badge">Based on your Chapter 1 PDF</span></div>
<div class="tabs" id="tabs" role="tablist"></div><section class="card" id="stage" aria-live="polite"></section>
<p class="footer">Tip: Questions and answer choices are shuffled each time you start a quiz. Your score is calculated when you finish each section.</p>
</main>
<script>
const bank = [
{type:"mc",cat:"Core concepts",q:"A researcher calculates the average score of the 40 students in one selected class. That average is a…",o:["Parameter","Statistic","Population","Variable"],a:1,e:"The 40 students are a sample in this scenario, so a numerical description of them is a statistic."},
{type:"mc",cat:"Core concepts",q:"Which statement best describes statistics?",o:["Only the study of averages","A set of procedures for collecting, organizing, presenting, analyzing, and interpreting data","A method used only in laboratory experiments","The process of selecting participants"],a:1,e:"Statistics involves the full process of working with numerical data, from collection through interpretation."},
{type:"mc",cat:"Core concepts",q:"A complete group of individuals or scores that a researcher wants to study is the…",o:["Sample","Statistic","Population","Data point"],a:2,e:"A population is the entire group of interest; a sample is a subset of that group."},
{type:"mc",cat:"Core concepts",q:"Which pairing is correct?",o:["Population — statistic","Sample — parameter","Population — parameter","Sample — population"],a:2,e:"A parameter describes a population. A statistic describes a sample."},
{type:"mc",cat:"Core concepts",q:"A single recorded score is called a ______; a collection of scores is called ______.",o:["data; datum","datum; data","variable; datum","sample; population"],a:1,e:"Datum is singular. Data is plural and refers to a collection of scores or observations."},
{type:"mc",cat:"Core concepts",q:"Which is the clearest example of a variable?",o:["The score 87","The number of hours each student studies","One student's recorded score of 87","The final table of results"],a:1,e:"A variable is a characteristic that can have different values across individuals or observations."},
{type:"mc",cat:"Statistics types",q:"A researcher makes a graph showing the test scores of 30 participants and reports their mean. This is primarily…",o:["Inferential statistics","Descriptive statistics","Experimental manipulation","Random assignment"],a:1,e:"Tables, graphs, and averages organize and summarize observed data: descriptive statistics."},
{type:"mc",cat:"Statistics types",q:"A researcher uses the results from 100 sampled voters to estimate the preference of all voters in a city. This is…",o:["Descriptive statistics","Inferential statistics","Nominal measurement","A control condition"],a:1,e:"Inferential statistics use sample information to draw conclusions or generalizations about a population."},
{type:"mc",cat:"Statistics types",q:"The difference between a sample statistic and its population parameter is called…",o:["Sampling error","Randomization","Measurement scale","Experimental effect"],a:0,e:"Sampling error is the discrepancy between a sample statistic and its population parameter."},
{type:"mc",cat:"Research methods",q:"A study finds that students who sleep longer tend to earn higher grades. What conclusion is justified?",o:["More sleep definitely causes higher grades","Higher grades definitely cause longer sleep","The variables are related, but causation has not been established","The study is automatically a true experiment"],a:2,e:"Correlation identifies a relationship. It does not, by itself, establish cause and effect."},
{type:"mc",cat:"Research methods",q:"In an experiment testing whether background music affects memory scores, memory score is the…",o:["Independent variable","Dependent variable","Control condition","Population"],a:1,e:"The dependent variable is the outcome measured—in this case, memory score."},
{type:"mc",cat:"Research methods",q:"A researcher changes the amount of study time and measures quiz performance. The amount of study time is the…",o:["Dependent variable","Independent variable","Sampling error","Parameter"],a:1,e:"The independent variable is manipulated or varied by the researcher."},
{type:"mc",cat:"Research methods",q:"Which set names the three characteristics of a true experimental design described in the chapter?",o:["Observation, prediction, correlation","Manipulation, control, randomization","Collection, organization, presentation","Population, sample, statistic"],a:1,e:"The three characteristics are manipulation, control, and randomization."},
{type:"mc",cat:"Research methods",q:"In a study about caffeine and attention, room temperature may affect attention but is not the focus. Room temperature is a(n)…",o:["Dependent variable","Extraneous variable","Parameter","Experimental condition"],a:1,e:"An extraneous variable is not the main focus but may influence the dependent variable."},
{type:"mc",cat:"Research methods",q:"What is the main role of a control condition?",o:["To provide a baseline for comparison","To guarantee a significant result","To manipulate the dependent variable","To eliminate the need for measurement"],a:0,e:"The control condition provides a baseline against which the experimental condition can be compared."},
{type:"mc",cat:"Measurement",q:"A student is assigned ID number 204. The number is only a label, not a rank or quantity. Which scale is used?",o:["Ordinal","Interval","Ratio","Nominal"],a:3,e:"Nominal measurement uses numbers or labels to identify categories without implying order."},
{type:"mc",cat:"Measurement",q:"A contest result lists contestants as 1st, 2nd, and 3rd, but the gaps between them are not measured. Which scale?",o:["Nominal","Ordinal","Interval","Ratio"],a:1,e:"Ordinal scales communicate order or rank, but not the exact magnitude of differences."},
{type:"mc",cat:"Measurement",q:"Temperature measured in degrees Celsius is…",o:["Nominal","Ordinal","Interval","Ratio"],a:2,e:"Celsius has equal intervals, but zero does not mean an absence of temperature; it is an interval scale."},
{type:"mc",cat:"Measurement",q:"A person's weight measured in kilograms is generally treated as…",o:["Nominal","Ordinal","Interval","Ratio"],a:3,e:"Ratio scales have equal intervals and a true/absolute zero."},
{type:"mc",cat:"Notation",q:"In the chapter's statistical notation, N represents…",o:["Number of scores in a sample","Number of scores in a population","A score value","The sum of all scores"],a:1,e:"N is the number of scores in a population; n is the number of scores in a sample."},
{type:"mc",cat:"Notation",q:"Which symbol represents the number of scores in a sample?",o:["N","n","X","Σ"],a:1,e:"Lowercase n represents the sample count."},
{type:"tf",cat:"True or false",q:"A parameter describes a population, while a statistic describes a sample.",a:true,e:"Correct. Keep the population/parameter and sample/statistic pairings distinct."},
{type:"tf",cat:"True or false",q:"Descriptive statistics are mainly used to generalize from a sample to a population.",a:false,e:"That is the purpose of inferential statistics. Descriptive statistics organize and summarize data."},
{type:"tf",cat:"True or false",q:"A correlation between two variables is enough to prove that one caused the other.",a:false,e:"Correlation does not imply causation. Other variables may account for the relationship."},
{type:"tf",cat:"True or false",q:"The dependent variable is the outcome that is measured in an experiment.",a:true,e:"The independent variable is manipulated; the dependent variable is measured."},
{type:"tf",cat:"True or false",q:"Ordinal scales show the order of categories, but do not tell the exact size of the differences between ranks.",a:true,e:"Ordinal scales indicate relative position or order, not the magnitude of the gaps."},
{type:"tf",cat:"True or false",q:"An interval scale has a true zero point.",a:false,e:"An interval scale has equal intervals but no absolute zero. A ratio scale has a true zero."},
{type:"tf",cat:"True or false",q:"Randomization is one of the three characteristics of a true experimental design.",a:true,e:"The chapter lists manipulation, control, and randomization."},
{type:"tf",cat:"True or false",q:"A sample must always contain every member of the population.",a:false,e:"A sample is a subset of the population. A census would include every member."},
{type:"id",cat:"Identification",q:"Give the term for a numerical value that describes an entire population.",a:["parameter"],e:"A parameter is a descriptive numerical value for a population."},
{type:"id",cat:"Identification",q:"What is the term for the discrepancy between a sample statistic and its population parameter?",a:["sampling error"],e:"The chapter defines this discrepancy as sampling error."},
{type:"id",cat:"Identification",q:"Name the scale of measurement in which numbers serve only as category labels.",a:["nominal","nominal scale"],e:"Nominal measurement classifies observations into categories without ranking them."},
{type:"id",cat:"Identification",q:"What is the variable manipulated by the researcher called?",a:["independent variable","independent"],e:"The independent variable is the variable manipulated by the researcher."},
{type:"id",cat:"Identification",q:"What is the outcome measured by the researcher called?",a:["dependent variable","dependent"],e:"The dependent variable is the measured outcome."},
{type:"id",cat:"Identification",q:"What is the term for the entire group a researcher wants to understand?",a:["population"],e:"The population is the complete group of interest."},
{type:"scenario",cat:"Application",q:"A survey asks 500 randomly selected Adamson students about study habits. The researcher wants to describe study habits of all Adamson students. Identify the sample.",o:["All Adamson students","The 500 selected students","All college students in Manila","Only students who answered a particular question"],a:1,e:"The sample is the subset actually selected: the 500 students."},
{type:"scenario",cat:"Application",q:"A researcher records each participant's preferred learning mode: visual, auditory, or reading/writing. Which scale?",o:["Nominal","Ordinal","Interval","Ratio"],a:0,e:"These are categories without a natural ranking, so the scale is nominal."},
{type:"scenario",cat:"Application",q:"A researcher compares a group receiving a new study technique with a group that does not receive it. The group receiving the technique is the…",o:["Control condition","Experimental condition","Population parameter","Sampling frame"],a:1,e:"The experimental condition receives the treatment or manipulation being studied."},
{type:"scenario",cat:"Application",q:"A study tests whether sleep duration affects attention. Participants' caffeine intake may also affect attention. Caffeine intake is best treated as…",o:["The dependent variable","An extraneous variable","The population","A nominal scale"],a:1,e:"Caffeine intake is not the main variable of interest but could influence the measured attention outcome."},
{type:"calc",cat:"Computation",q:"For X = 2, 4, and 5, find ΣX².",a:["45"],e:"Square each score, then add: 2² + 4² + 5² = 4 + 16 + 25 = 45."},
{type:"calc",cat:"Computation",q:"For X = 3, 1, and 4, find (ΣX)².",a:["64"],e:"First add: ΣX = 3 + 1 + 4 = 8. Then square: 8² = 64."},
{type:"calc",cat:"Computation",q:"For X = 3, 1, 7, and 4, find Σ(X − 1)².",a:["49"],e:"Calculate each term first: 4 + 0 + 36 + 9 = 49."},
{type:"calc",cat:"Computation",q:"A population has 80 scores. What is N?",a:["80"],e:"N is the number of scores in a population, so N = 80."},
{type:"calc",cat:"Computation",q:"A sample contains 25 scores. What is n?",a:["25"],e:"Lowercase n is the number of scores in a sample."}
];
const sections=[
{name:"Mixed challenge",desc:"Random mix · 15 questions",filter:()=>true,count:15},
{name:"Multiple choice",desc:"Concepts and tricky distinctions",filter:q=>q.type==="mc",count:0},
{name:"True or false",desc:"Watch for absolute wording",filter:q=>q.type==="tf",count:0},
{name:"Identification",desc:"Type the exact statistical term",filter:q=>q.type==="id",count:0},
{name:"Scenarios",desc:"Apply concepts to research situations",filter:q=>q.type==="scenario",count:0},
{name:"Computation",desc:"Notation and summation practice",filter:q=>q.type==="calc",count:0}
];
let current=0, questions=[],pos=0,results=[];
const tabs=document.getElementById("tabs"),stage=document.getElementById("stage");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function node(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function drawTabs(){tabs.replaceChildren();sections.forEach((s,i)=>{let b=node("button","tab");b.setAttribute("role","tab");b.setAttribute("aria-selected",i===current);b.append(node("b","",s.name),node("span","",s.desc));b.onclick=()=>{current=i;start()};tabs.append(b)})}
function start(){let s=sections[current],pool=bank.filter(s.filter);questions=shuffle(pool);if(s.count)questions=questions.slice(0,s.count);pos=0;results=[];drawTabs();showQ()}
function showQ(){let q=questions[pos];stage.replaceChildren();let meter=node("div","meter"),fill=node("i");fill.style.width=(pos/questions.length*100)+"%";meter.append(fill);stage.append(meter,node("p","count",`Question ${pos+1} of ${questions.length} · ${q.cat}`),node("h2","q",q.q));
if(q.type==="id"||q.type==="calc"){let input=node("input","input");input.type="text";input.placeholder=q.type==="id"?"Type your answer…":"Enter your numerical answer…";input.autocomplete="off";stage.append(input);let submit=node("button","btn","Submit answer");submit.style.marginTop="12px";submit.onclick=()=>{if(!input.value.trim())return;gradeText(input.value,q,input,submit)};stage.append(submit);input.addEventListener("keydown",e=>{if(e.key==="Enter")submit.click()});input.focus()}
else{let opts=q.type==="tf"?["True","False"]:[...q.o.map((v,i)=>({v,correct:i===q.a}))];if(q.type!=="tf")opts=shuffle(opts);else opts=shuffle(opts.map(v=>({v,correct:(v==="True")===q.a})));let box=node("div","opts");opts.forEach(o=>{let b=node("button","opt",typeof o==="string"?o:o.v);b.onclick=()=>gradeChoice(o,b,box,q);box.append(b)});stage.append(box)}
}
function advance(){let last=pos===questions.length-1;let row=node("div","row"),b=node("button","btn",last?"See results":"Next question");b.onclick=()=>last?score(): (pos++,showQ());row.append(b);stage.append(row);b.focus()}
function feedback(ok,q,detail){let fb=node("div","fb");fb.append(node("strong","",ok?"Correct.":"Not quite."),document.createTextNode(" "+q.e+(detail?" "+detail:"")));stage.append(fb);advance()}
function gradeChoice(o,b,box,q){let ok=!!o.correct;[...box.children].forEach(x=>{x.disabled=true;if(x.textContent===(q.type==="tf"?(q.a?"True":"False"):q.o[q.a]))x.classList.add("right")});if(!ok)b.classList.add("wrong");results.push({ok,q,answer:ok?"Correct":(q.type==="tf"?(q.a?"True":"False"):q.o[q.a])});feedback(ok,q)}
function normalize(s){return s.toLowerCase().trim().replace(/[.,!?;:]/g,"").replace(/\s+/g," ")}
function gradeText(value,q,input,button){let ok=q.a.some(a=>normalize(value)===normalize(a));input.disabled=true;button.disabled=true;results.push({ok,q,answer:q.a[0],given:value});feedback(ok,q,ok?"":`Accepted answer: ${q.a[0]}.`)}
function score(){stage.replaceChildren(node("p","count",sections[current].name+" complete"));let n=results.filter(r=>r.ok).length,pct=Math.round(n/results.length*100);stage.append(node("div","score",`${n} / ${results.length}`),node("p","",`${pct}% — ${pct>=85?"Excellent mastery.":pct>=70?"Good work. Review the missed items.":"Keep practicing and retake this section."}`));let ul=node("ul","review");results.forEach((r,i)=>{let li=node("li",r.ok?"ok":"no",`${r.ok?"✓":"✗"} ${i+1}. ${r.q.q}${r.ok?"":`  Answer: ${r.answer}`}`);ul.append(li)});stage.append(ul);let row=node("div","row"),again=node("button","btn","Retake · reshuffle"),next=node("button","btn alt","Next section");again.onclick=start;next.onclick=()=>{current=(current+1)%sections.length;start()};row.append(again,next);stage.append(row)}
start();
</script></body></html>
